name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install
      - name: Generate Prisma client
        run: pnpm prisma:generate || true
      - name: Run lint
        run: pnpm lint || true
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build
