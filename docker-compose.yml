version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medium_dashboard
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/medium_dashboard?schema=public"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "pnpm install && pnpm prisma:generate && pnpm run db:push && pnpm run seed && pnpm dev"

volumes:
  db-data: {}
